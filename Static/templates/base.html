<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page_title }} | Data Workspace</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}" />
    <script defer src="{{ url_for('static', path='js/main.js') }}"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="logo">Data Workspace</div>
      <nav class="main-nav">
        <a href="{{ url_for('dataset-management') }}" class="{% if active_page == 'dataset' %}active{% endif %}">Dataset management</a>
        <a href="{{ url_for('global-analysis') }}" class="{% if active_page == 'global' %}active{% endif %}">Global analysis</a>
        <a href="{{ url_for('file-analysis') }}" class="{% if active_page == 'file' %}active{% endif %}">File analysis</a>
        <a href="{{ url_for('file-explorer') }}" class="{% if active_page == 'explorer' %}active{% endif %}">File explorer</a>
      </nav>
      <div class="dataset-switcher">
        <label for="current-dataset-select">Current dataset</label>
        <select id="current-dataset-select">
          <option value="" {% if not current_dataset %}selected{% endif %}>No dataset</option>
          {% for dataset in datasets %}
          <option value="{{ dataset }}" {% if current_dataset == dataset %}selected{% endif %}>{{ dataset }}</option>
          {% endfor %}
        </select>
      </div>
    </header>

    <main class="content">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <small>Prototype generated with FastAPI &amp; Jinja2.</small>
    </footer>
  </body>
</html>
